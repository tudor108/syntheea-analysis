cohort_rules:
  treatment_opportunity_90d:
    grain: one row per synthetic patient
    population: eligibility_flag == true
    index_date: eligibility_date
    event: initiated_within_90d == true
    gap: eligible_not_initiated_90d == true
    censoring: initiation_90d_status == CENSORED_NOT_EVALUABLE
    reconciliation: eligible = initiated_within_90d + treatment_gap_90d + censored_not_evaluable
    definition_version_field: eligibility_rule_version
  persistence_12m:
    population: eligibility_flag == true and initiated_within_90d == true
    index_date: treatment_start_date
    event_free_state: persistence_12m_status == PERSISTENT
    evaluable_states:
    - PERSISTENT
    - DISCONTINUED
    - SWITCHED
    censoring_state: CENSORED_NOT_EVALUABLE
    primary_permissible_gap_days: 60
    sensitivity_gap_days:
    - 30
    - 60
    - 90
    definition_version_field: persistence_rule_version
model_populations:
  non_initiation_90d:
    index: eligibility_date
    population: >-
      unique proposed-eligible records with valid eligibility time and a determinable 90-day
      initiated versus not-initiated status; earlier censoring is excluded and counted
    target: initiation_90d_status == NOT_INITIATED_WITHIN_90D
    prediction_stage: eligibility
    future_information_allowed: false
    evaluation: repeated rolling temporal, final untouched temporal, and development-only LOMO
  discontinuation_12m:
    index: treatment_start_date
    population: >-
      unique initiators with a qualifying persistence failure by day 365 or observation remaining
      event-free beyond day 365; earlier competing and censoring states are excluded and counted
    target: persistence_failure_flag by day 365 under the 60-day permissible-gap definition
    prediction_stage: treatment_start
    future_information_allowed: false
    evaluation: repeated rolling temporal, final untouched temporal, and development-only LOMO
  switch_12m:
    index: treatment_start_date
    population: >-
      unique initiators with explicit switch by day 365 or observation remaining event-free beyond
      day 365; earlier non-switch failures, death and censoring are excluded and counted
    target: event_classification == SWITCHED by day 365
    prediction_stage: treatment_start
    future_information_allowed: false
    evaluation: repeated rolling temporal, final untouched temporal, and development-only LOMO
  restart_after_gap:
    index: treatment_start_date
    population: >-
      unique initiators with a qualifying 60-day gap failure by day 365 and either an explicit dated
      restart by day 365 or observation through day 365 without restart; undated restart classes and
      earlier indeterminate censoring are excluded and counted
    target: explicit restart_date by day 365 versus no restart through day 365
    prediction_stage: treatment_start; this is not a gap-triggered operational model
    future_information_allowed: false
    retrospective_selection_warning: gap-failure membership is not known at prediction time
    evaluation: repeated rolling temporal, final untouched temporal, and development-only LOMO
