castration_resistant_transition_probability: 0.2
clinical_rule_configuration:
  clinical_rules:
    active_surveillance:
      inputs:
      - localized_flag
      - risk_group
      - isup_grade_group
      - age_at_index
      - observation_window
      market_applicability:
      - US
      - DE
      - JP
      - FR
      - CN
      - AU
      - CA
      output: active_surveillance_state_and_events
      source_assumption: Synthetic AS pathway with monitoring, reclassification, exit
        and observed treatment transition.
      version: ACTIVE-SURVEILLANCE-v1.1
    arpi_eligibility:
      inputs:
      - mhspc_flag
      - age_at_index
      - contraindication_flag
      - data_sufficiency_flag
      - possible_followup_days
      market_applicability:
      - US
      - DE
      - JP
      - FR
      - CN
      - AU
      - CA
      output: eligibility_flag
      source_assumption: Synthetic diagnostic denominator for pathway analysis; not
        authoritative clinical criteria.
      version: ARPI-ELIG-SYN-v2.0
    clinical_state_model:
      inputs:
      - prostate_stage
      - hormone_sensitive_flag
      - castration_resistant_flag
      - dated_progression
      market_applicability:
      - US
      - DE
      - JP
      - FR
      - CN
      - AU
      - CA
      output: disease_state_event
      source_assumption: Forward-only synthetic prostate disease-state model; requires
        clinical validation.
      version: CLINICAL-STATE-v2.1
    intensification:
      inputs:
      - disease_state
      - regimen_components
      market_applicability:
      - US
      - DE
      - JP
      - FR
      - CN
      - AU
      - CA
      output: intensification_flag
      source_assumption: For synthetic mHSPC analysis, ADT plus ARPI and/or chemotherapy
        is classified as intensified; not a recommendation.
      version: INTENSIFICATION-SYN-v1.0
    isup_mapping:
      inputs:
      - gleason_primary_pattern
      - gleason_secondary_pattern
      - gleason_score
      market_applicability:
      - US
      - DE
      - JP
      - FR
      - CN
      - AU
      - CA
      output: isup_grade_group
      source_assumption: Standard score-pattern mapping represented explicitly for
        synthetic validation.
      version: ISUP-MAP-v1.0
    mhspc_derivation:
      inputs:
      - prostate_cancer_flag
      - metastatic_flag
      - hormone_sensitive_flag
      - castration_resistant_flag
      market_applicability:
      - US
      - DE
      - JP
      - FR
      - CN
      - AU
      - CA
      output: mhspc_flag
      source_assumption: Synthetic cohort definition; requires clinical validation
        and is not a treatment guideline.
      version: MHSPC-SYN-v2.0
    observation_censoring:
      inputs:
      - diagnosis_date
      - administrative_end
      - death_date
      - loss_to_follow_up_date
      market_applicability:
      - US
      - DE
      - JP
      - FR
      - CN
      - AU
      - CA
      output: censor_date
      source_assumption: Censoring is the earliest observable terminal boundary; death
        and LTFU compete.
      version: OBSERVATION-v2.1
    outcome_model:
      inputs:
      - disease_state
      - psa
      - comorbidity
      - treatment_observed_before_candidate_date
      market_applicability:
      - US
      - DE
      - JP
      - FR
      - CN
      - AU
      - CA
      output: dated_outcome_events
      source_assumption: Probabilistic synthetic outcomes with time-aligned upstream
        inputs; not causal evidence.
      version: OUTCOME-SYN-v2.1
    persistence:
      inputs:
      - treatment_start_date
      - dispensing_coverage
      - refill_gap_days
      - discontinuation_date
      - switch_date
      - censor_date
      market_applicability:
      - US
      - DE
      - JP
      - FR
      - CN
      - AU
      - CA
      output: persistence_status
      source_assumption: Operational sensitivity definitions using independently evaluated
        30/60/90-day permissible gaps.
      version: PERSISTENCE-SYN-v2.1
  version: CLINICAL-RULES-v1.0
