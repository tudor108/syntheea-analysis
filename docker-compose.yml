name: prostate-journey-local

services:
  analytics-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: prostate-journey-analytics:local
    init: true
    read_only: true
    environment:
      PROSTATE_JOURNEY_ENVIRONMENT: local
      PROSTATE_JOURNEY_HOST: 0.0.0.0
      PROSTATE_JOURNEY_PORT: 8080
      PROSTATE_JOURNEY_LOG_LEVEL: ${PROSTATE_JOURNEY_LOG_LEVEL:-INFO}
      PROSTATE_JOURNEY_LOG_FORMAT: json
      PROSTATE_JOURNEY_RELEASE_ROOT: /app/data/releases
      PROSTATE_JOURNEY_PRESENTATION_ROOT: /app/outputs/presentation
      PROSTATE_JOURNEY_TEMP_ROOT: /tmp/prostate-journey
      PROSTATE_JOURNEY_EXPERIMENT_ROOT: /app/outputs/experiments
      PROSTATE_JOURNEY_VERIFY_RELEASE_HASHES: "true"
    ports:
      - "127.0.0.1:${PROSTATE_JOURNEY_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./data/releases
        target: /app/data/releases
        read_only: true
      - type: bind
        source: ./outputs/presentation
        target: /app/outputs/presentation
        read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3).read()
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
