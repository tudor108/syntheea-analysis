[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prostate-patient-journey-synthetic"
version = "0.1.0"
description = "Reproducible synthetic prostate patient journey demo"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "duckdb>=1.0", "PyYAML>=6", "pydantic>=2.6", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
prostate-journey = "prostate_journey.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"src/prostate_journey/dashboard.py" = ["E501"]
